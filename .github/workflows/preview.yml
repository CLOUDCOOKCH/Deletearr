name: Publish NAS preview
on:
  push:
    branches: [deletarr]
    paths:
      - .github/workflows/preview.yml
      - Dockerfile
      - .dockerignore
      - deletarr/**
      - web/**
      - requirements.lock
      - package*.json
      - tsconfig.json
      - vite.config.ts
      - scripts/container-smoke.py
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: nas-preview
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Smoke-test AMD64 image before publishing
        run: |
          docker build -t deletarr:preview-test .
          python3 scripts/container-smoke.py deletarr:preview-test
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:preview
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          provenance: true
          sbom: true
          cache-from: type=gha,scope=nas-preview
          cache-to: type=gha,scope=nas-preview,mode=max
